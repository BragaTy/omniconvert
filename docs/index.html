<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniConvert - Conversor Universal de Arquivos</title>
    <meta name="description" content="Converta qualquer arquivo para qualquer formato compatível diretamente no seu navegador. Gratuito, ilimitado e 100% privado." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Redirecionamento automático caso o GitHub Pages esteja configurado para a raiz
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var p = window.location.pathname;
        if (!p.endsWith('/')) p += '/';
        window.location.replace(p + 'docs/' + window.location.search + window.location.hash);
      }
    </script>
    <script type="module" crossorigin src="./assets/index-Ct2RFGAJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DJVNhL-f.css">

  </body>
